name: Deploy fraud intelligence demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/fraud-intelligence/**'
      - '.github/workflows/fraud-intelligence-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fraud-intelligence-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload demo files
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/fraud-intelligence
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4