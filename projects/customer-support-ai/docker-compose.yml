services:
  support:
    build: .
    ports:
      - "8766:8766"
    environment:
      HOST: 0.0.0.0
      PORT: 8766
      DATABASE_PATH: /data/support.sqlite3
      SEED_DEMO: "1"
    volumes:
      - support-data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  support-data:
